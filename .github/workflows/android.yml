name: Build Android APK

# This sandbox can't reach Google's Android Maven/SDK servers, so the APK
# is built here on GitHub's runners instead — they have the Android SDK
# preinstalled and full internet. Every push (or a manual run) produces a
# sideloadable debug APK you download from the run's Artifacts. No Android
# Studio, no Mac, nothing to install locally.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the APK as a release asset, which is what gives it a
    # permanent public download URL.
    permissions:
      contents: write

    # At the job rather than the step, because `secrets` cannot be read from
    # a step's `if:` — only `env` can, and a step's own `env:` block is not
    # reliably in scope for its own condition. Every optional step below is
    # gated on one of these being non-empty, so the build works untouched
    # with none of them set.
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      POND_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      POND_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      POND_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest ships the Android SDK; this just puts it on PATH.
      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      # Without this the APK serves the copy of dist/ that was baked into it,
      # so every fix means sideloading a new build — which is how a bug that
      # was fixed an hour earlier kept reproducing on the phone.
      #
      # Pointing the Android shell at the live site instead makes it a native
      # window onto pond.eend.app: every Vercel deploy is in the app on the
      # next launch, no reinstall, and the service worker inside the WebView
      # still caches the shell so it works offline after first load. A new APK
      # is then only needed when native code changes — plugins, icon,
      # permissions.
      #
      # Android only, deliberately. iOS keeps the bundled assets because App
      # Store review treats a remote-URL wrapper as failing the minimum
      # functionality bar, and TestFlight builds go through the same review.
      - name: Point the Android shell at the live site
        run: |
          node -e '
            const fs = require("fs");
            const c = JSON.parse(fs.readFileSync("capacitor.config.json", "utf8"));
            c.server = { url: "https://pond.eend.app", cleartext: false };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(c, null, 2));
            console.log(c);
          '

      # Push notifications have never actually worked on Android: the app asks
      # FCM for a device token, FCM needs this file to know which project to
      # answer for, and without it registration simply never returns. The
      # permission prompt appears, the user says yes, and no token is ever
      # stored. The file is gitignored because it identifies a specific
      # Firebase project, so it arrives as a secret instead.
      #
      # Before cap sync, because the google-services Gradle plugin is applied
      # at configure time based on whether the file exists.
      - name: Write google-services.json, if configured
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Sync Capacitor → Android
        run: npx cap sync android

      # Android refuses to install an update signed by a different key, and a
      # fresh runner has no debug keystore, so Gradle generates a brand new
      # one every single build. Left alone, every APK is a different app as
      # far as the phone is concerned: each install means uninstalling the
      # last one first, and Firebase App Distribution's whole "tap to update"
      # story never works once.
      #
      # One key, held as a secret, fixes that permanently. To make one:
      #
      #   keytool -genkeypair -v -keystore pond.keystore -alias pond \
      #     -keyalg RSA -keysize 2048 -validity 10000
      #   base64 -w0 pond.keystore    # macOS: base64 -i pond.keystore
      #
      # Then add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD as repository secrets, and
      # keep the .keystore file somewhere safe — losing it means every tester
      # uninstalls and reinstalls once, and would end a Play listing outright.
      - name: Use the shared signing key, if one is configured
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pond.keystore"
          echo "POND_KEYSTORE_FILE=$RUNNER_TEMP/pond.keystore" >> "$GITHUB_ENV"

      - name: Assemble debug APK
        env:
          POND_VERSION_CODE: ${{ github.run_number }}
          POND_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pond-hopping-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A run artifact needs a GitHub login and four taps to reach, which is
      # no good on the phone you're trying to install onto. A release asset on
      # a public repo is a plain URL that never changes:
      #
      #   https://github.com/damo1111/pond_hopping/releases/latest/download/pond-hopping.apk
      #
      # One rolling "latest" release, re-uploaded each build, so the link can
      # be bookmarked or turned into a QR code once and left alone.
      - name: Publish as the latest downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pond-hopping.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest Android build" --notes "Bootstrapping."
          gh release upload latest pond-hopping.apk --clobber
          gh release edit latest --latest --notes "$(printf '%s\n\n%s\n\n%s' \
            "Debug build from ${GITHUB_SHA::7} — $(date -u '+%d %b %Y, %H:%M UTC')." \
            "Install: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/pond-hopping.apk" \
            "Android will warn about installing outside the Play Store; that's expected for a sideloaded build.")"

      # Firebase App Distribution is the Android equivalent of TestFlight —
      # testers get an email with a direct install link, no GitHub login,
      # no Play Store account needed. Skipped automatically (rather than
      # failing the build) until FIREBASE_APP_ID and
      # FIREBASE_SERVICE_ACCOUNT_KEY secrets are added in repo Settings.
      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ env.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: family
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: Auto-built from ${{ github.sha }}

      # ---------------------------------------------------------------- Play
      #
      # The Play Console's internal testing track: testers install and update
      # through the Play Store like any other app, which is as close to
      # TestFlight as Android gets. Everything below is skipped until the
      # secrets exist, so a repository without them builds exactly as before.
      #
      # Play will not take an APK for a new app, only an Android App Bundle,
      # and will not take an unsigned one — so this needs the same shared
      # keystore as above, which becomes the *upload* key. Play re-signs with
      # its own key on the way out; losing the upload key is recoverable by
      # asking Google for a reset, unlike losing the signing key of a
      # sideloaded APK.
      #
      # To set it up, once:
      #   1. play.google.com/console — £20 one-off, create the app, package
      #      name pond.eend.app (the applicationId, not the namespace).
      #   2. Console → Users and permissions → Invite new users → paste the
      #      service account's address, add the app, tick "Release apps to
      #      testing tracks", Invite. Guides send you to Setup → API access
      #      instead; that page has been moved and relabelled more than once
      #      and may simply not be in the nav. Users and permissions makes
      #      the same grant and is still there.
      #   3. Google Cloud: enable the Google Play Android Developer API on
      #      the project, then IAM & Admin → Service Accounts → Keys → Add
      #      key → JSON → PLAY_SERVICE_ACCOUNT_JSON.
      #
      # The first upload of any app must be made by hand in the console —
      # the API refuses to create the very first release. After that this
      # runs on every push.
      #
      # Note that the bundle inherits the remote-URL config set above, so the
      # Play build is a window onto pond.eend.app exactly like the sideloaded
      # APK. That is deliberate: it keeps the property that a Vercel deploy is
      # in the app on the next launch, rather than needing a Play release for
      # every text change. The risk is that Play's minimum-functionality
      # policy takes a dim view of thin web wrappers. Internal testing is
      # barely reviewed so it is very unlikely to bite there; if it ever does,
      # or if this goes to production, drop the "Point the Android shell at
      # the live site" step for this build and the assets ship inside the
      # bundle instead.
      # Gated on the keystore alone, not on the Play credentials, because the
      # very first upload has to be made by hand and the console will not
      # create a service account for an app that does not exist yet. Without
      # a downloadable bundle before any Play setup, that is a deadlock.
      - name: Build the release bundle for Play
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          POND_VERSION_CODE: ${{ github.run_number }}
          POND_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          ./gradlew --no-daemon bundleRelease

      # Attached to the same rolling release as the APK, so the first manual
      # upload is a download from a URL rather than a local Android toolchain.
      - name: Publish the bundle alongside the APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab pond-hopping.aab
          gh release upload latest pond-hopping.aab --clobber

      - name: Upload to the internal testing track
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          # applicationId, not namespace. build.gradle carries both and they
          # are deliberately different: `namespace` is app.eend.pond, the
          # Java package, invisible outside the build; `applicationId` is
          # pond.eend.app, what the app was registered as and the only name
          # Play has ever heard of. This said app.eend.pond, and Play
          # answered "Package not found" — after authenticating happily and
          # opening an edit, which is why it reads like a credentials
          # problem and is not one.
          #
          # Wrong since the day the package was renamed to match the Play
          # entry, and invisible for every run since, because the step is
          # gated on a secret that did not exist yet. Nothing was ever
          # published for it to be caught by.
          packageName: pond.eend.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
