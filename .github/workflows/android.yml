name: Build Android APK

# This sandbox can't reach Google's Android Maven/SDK servers, so the APK
# is built here on GitHub's runners instead — they have the Android SDK
# preinstalled and full internet. Every push (or a manual run) produces a
# sideloadable debug APK you download from the run's Artifacts. No Android
# Studio, no Mac, nothing to install locally.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    # Needed to publish the APK as a release asset, which is what gives it a
    # permanent public download URL.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ubuntu-latest ships the Android SDK; this just puts it on PATH.
      - uses: android-actions/setup-android@v3

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor → Android
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pond-hopping-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # A run artifact needs a GitHub login and four taps to reach, which is
      # no good on the phone you're trying to install onto. A release asset on
      # a public repo is a plain URL that never changes:
      #
      #   https://github.com/damo1111/pond_hopping/releases/latest/download/pond-hopping.apk
      #
      # One rolling "latest" release, re-uploaded each build, so the link can
      # be bookmarked or turned into a QR code once and left alone.
      - name: Publish as the latest downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pond-hopping.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest Android build" --notes "Bootstrapping."
          gh release upload latest pond-hopping.apk --clobber
          gh release edit latest --latest --notes "$(printf '%s\n\n%s\n\n%s' \
            "Debug build from ${GITHUB_SHA::7} — $(date -u '+%d %b %Y, %H:%M UTC')." \
            "Install: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/pond-hopping.apk" \
            "Android will warn about installing outside the Play Store; that's expected for a sideloaded build.")"

      # Firebase App Distribution is the Android equivalent of TestFlight —
      # testers get an email with a direct install link, no GitHub login,
      # no Play Store account needed. Skipped automatically (rather than
      # failing the build) until FIREBASE_APP_ID and
      # FIREBASE_SERVICE_ACCOUNT_KEY secrets are added in repo Settings.
      - name: Distribute to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_SERVICE_ACCOUNT_KEY != '' }}
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ env.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ env.FIREBASE_SERVICE_ACCOUNT_KEY }}
          groups: family
          file: android/app/build/outputs/apk/debug/app-debug.apk
          releaseNotes: Auto-built from ${{ github.sha }}
