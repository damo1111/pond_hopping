apply plugin: 'com.android.application'

// One signing key across every build, when CI has been given one.
//
// Without it Gradle invents a fresh debug keystore on each machine, and
// Android treats an APK signed by a different key as a different app: the
// update refuses to install, and the only way through is uninstalling first.
// That is survivable for one person with a cable and fatal for anything that
// looks like TestFlight.
//
// Absent the environment variables — which is every local build, and CI
// until the secrets are added — nothing here applies and the debug build
// signs itself exactly as it did before. See .github/workflows/android.yml
// for how to make the key.
def keystoreFile = System.getenv("POND_KEYSTORE_FILE")
def hasSharedKey = keystoreFile != null && !keystoreFile.isEmpty() && file(keystoreFile).exists()

// Play rejects an upload whose versionCode it has seen before, permanently
// and per number — so a hardcoded 1 allows exactly one release ever. CI
// passes the run number, which only ever goes up; a local build keeps 1,
// because a local build is never the thing being uploaded.
def ciVersionCode = System.getenv("POND_VERSION_CODE")
def ciVersionName = System.getenv("POND_VERSION_NAME")

android {
    namespace = "app.eend.pond"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.eend.pond"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode ciVersionCode ? ciVersionCode.toInteger() : 1
        versionName ciVersionName ?: "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasSharedKey) {
            shared {
                storeFile file(keystoreFile)
                storePassword System.getenv("POND_KEYSTORE_PASSWORD")
                keyAlias System.getenv("POND_KEY_ALIAS")
                keyPassword System.getenv("POND_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        debug {
            // The distributed build is the debug one — see the workflow for
            // why — so this is the build type that has to be stably signed.
            if (hasSharedKey) signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSharedKey) signingConfig signingConfigs.shared
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
