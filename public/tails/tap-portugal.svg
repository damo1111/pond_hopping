<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 130 100" width="130" height="100" role="img" aria-label="TAP Air Portugal tail">
  <!--
    Drawn rather than photographed. Every other tail in this folder is a
    cropped photo with a flat background; this is an SVG, so it is
    transparent by construction and stays sharp at the 22px the flight card
    actually renders it at — where the lettering on a photograph is a smudge
    regardless.

    Simplified to what survives at that size: the raked fin, the red field,
    the lime wedge low on the leading edge, and the white counters. The
    wordmark is included for the larger uses but is the first thing to
    disappear, which is correct.
  -->
  <defs>
    <clipPath id="tap-fin">
      <path d="M6 98 C34 60 62 26 92 4 C99 -1 106 2 108 9 L126 98 Z" />
    </clipPath>
  </defs>

  <g clip-path="url(#tap-fin)">
    <!-- The red field, which is most of it. -->
    <rect x="0" y="0" width="130" height="100" fill="#E4002B" />

    <!-- Lime wedge along the leading edge, with the darker green at the
         very foot where the fin meets the fuselage. -->
    <path d="M6 98 C30 64 54 34 78 12 L78 98 Z" fill="#A5CD39" />
    <path d="M6 98 C12 90 18 82 24 74 L38 98 Z" fill="#00A05D" />

    <!-- The white counters of the mark: the bowl top right, the block low
         right, and the notch in the lime. -->
    <path d="M92 16 h20 a13 13 0 0 1 0 26 h-20 z" fill="#FFFFFF" />
    <path d="M96 66 h30 v20 h-30 z" fill="#FFFFFF" />
    <path d="M30 86 h34 v14 h-34 z" fill="#FFFFFF" />

    <!-- Silver edge highlight down the trailing edge. -->
    <path d="M112 8 L130 98 L122 98 L106 12 Z" fill="#D9D9D6" opacity="0.85" />

    <text
      x="74"
      y="62"
      fill="#FFFFFF"
      font-family="Helvetica, Arial, sans-serif"
      font-size="11"
      font-weight="700"
      letter-spacing="0.5"
      transform="rotate(-90 74 62)"
      text-anchor="middle"
    >TAP PORTUGAL</text>
  </g>
</svg>
